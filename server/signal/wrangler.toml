# Lokki room service (Cloudflare Worker). Setup steps: docs/online-setup.md
name = "lokki-rooms"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Create the KV namespace with `npx wrangler kv namespace create ROOMS`, then paste its id here.
[[kv_namespaces]]
binding = "ROOMS"
id = "PASTE_THE_ID_FROM_WRANGLER_HERE"

# Optional: only let your own page use the service (the address of your game, no trailing slash)
# [vars]
# ALLOW_ORIGIN = "https://YOURNAME.github.io"

# Optional relay (TURN), see docs/online-setup.md part 3. Add the two secrets with:
#   npx wrangler secret put TURN_KEY_ID
#   npx wrangler secret put TURN_API_TOKEN
