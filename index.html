<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lokki</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #fde8d7; font-family: system-ui, sans-serif; }
      #app, canvas { display: block; width: 100%; height: 100%; }
      #debug { position: fixed; top: 8px; left: 8px; font: 12px/1.4 monospace; color: #3a3a4a; max-height: 95vh; overflow: auto;
               background: rgba(255,255,255,.75); padding: 6px 8px; border-radius: 6px; }
      #debug h4 { margin: 8px 0 2px; text-transform: uppercase; font-size: 11px; }
      #debug label { display: grid; grid-template-columns: 110px 120px 50px; align-items: center; gap: 4px; }
      #debug button { margin: 6px 6px 0 0; }
      #hud { position: fixed; inset: 0; pointer-events: none; font: 14px/1.3 system-ui, sans-serif; color: #3a3a4a; }
      #hud .flash { position: absolute; inset: 0; opacity: 0; }
      #hud .info { position: absolute; top: 10px; right: 12px; background: rgba(255,255,255,.75); padding: 4px 10px; border-radius: 6px; }
      #hud .wind { position: absolute; top: 44px; right: 20px; font-size: 22px; background: rgba(255,255,255,.75); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
      #hud .arrow { display: inline-block; }
      #hud .stam { position: absolute; bottom: 36px; left: 50%; width: 220px; height: 10px; margin-left: -110px; background: rgba(255,255,255,.6); border-radius: 6px; overflow: hidden; }
      #hud .bar { height: 100%; width: 100%; background: #ffd36e; }
      #hud .prompt { position: absolute; bottom: 58px; width: 100%; text-align: center; font-weight: 600; text-shadow: 0 1px 0 #fff; }
      #hud .poop { position: absolute; bottom: 36px; left: 50%; margin-left: 120px; width: 40px; height: 10px; background: rgba(255,255,255,.6); border-radius: 6px; overflow: hidden; }
      #hud .pbar { height: 100%; width: 100%; background: #fbfaf4; }
      #hud .toast { position: absolute; top: 38%; width: 100%; text-align: center; font-size: 30px; font-weight: 700; opacity: 0; transition: opacity .3s; text-shadow: 0 2px 0 #fff; }
      #hud .keys { position: absolute; bottom: 10px; width: 100%; text-align: center; font-size: 12px; opacity: .8; }
      #boot { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; text-align: center; background: linear-gradient(#cfe8f5, #fde8d7); color: #3a3a4a; transition: opacity .5s; }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot h1 { margin: 0; font-size: 56px; letter-spacing: 2px; } #boot p { margin: 6px 0 0; opacity: .75; }
      #boot .bar { width: 220px; height: 8px; margin: 18px auto 0; background: rgba(255,255,255,.7); border-radius: 6px; overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: 40%; background: #ffd36e; border-radius: 6px; animation: bootslide 1.2s ease-in-out infinite; }
      @keyframes bootslide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
      #title { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(207,232,245,.55); backdrop-filter: blur(3px); font-family: system-ui, sans-serif; color: #3a3a4a; }
      #title[hidden], #options[hidden] { display: none; }
      .title-card { text-align: center; max-width: 520px; padding: 24px 32px; background: rgba(255,255,255,.88); border-radius: 16px; box-shadow: 0 8px 30px rgba(60,60,90,.25); }
      .title-card h1 { margin: 0; font-size: 64px; letter-spacing: 3px; } .title-gull { font-size: 46px; }
      .title-card .tag { margin: 2px 0 16px; opacity: .8; }
      .title-card button, .menu-card button { font: inherit; padding: 8px 18px; margin: 4px; border: 0; border-radius: 10px; background: #fff3c4; color: #3a3a4a; cursor: pointer; box-shadow: 0 2px 0 #d9c9a3; }
      .title-card button:hover, .menu-card button:hover { background: #ffe9a0; }
      .title-card button.big { font-size: 22px; padding: 10px 44px; background: #ffd36e; }
      .title-keys { font-size: 12px; opacity: .8; margin: 14px 0 4px; } .title-best { margin: 6px 0 0; font-weight: 600; } .title-note { margin: 10px 0 0; font-size: 11px; opacity: .6; }
      #options { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 45; }
      .menu-card { min-width: 320px; padding: 14px 22px 16px; background: rgba(255,255,255,.95); border-radius: 12px; box-shadow: 0 8px 30px rgba(60,60,90,.3); color: #3a3a4a; font: 14px/1.4 system-ui, sans-serif; }
      .menu-card h3 { margin: 0 0 8px; } .menu-card label { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 8px; margin: 6px 0; } .menu-card label.chk { grid-template-columns: auto 1fr; }
      .menu-keys { font-size: 12px; opacity: .7; }
      #tip { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); z-index: 20; padding: 8px 18px; background: rgba(255,255,255,.9); color: #3a3a4a; border-radius: 20px; font: 600 15px system-ui, sans-serif; box-shadow: 0 2px 8px rgba(60,60,90,.25); pointer-events: none; transition: opacity .3s; }
      #tip[hidden] { display: none; } #tip small { font-weight: 400; opacity: .6; margin-left: 8px; }
      #credits { z-index: 46; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); max-width: 460px; background: rgba(255,255,255,.92); padding: 14px 20px; border-radius: 10px; color: #3a3a4a; font: 14px/1.4 system-ui, sans-serif; }
      #credits[hidden] { display: none; }
      #credits h3 { margin: 0 0 6px; }
      #todo { position: fixed; left: 14px; top: 62px; width: 250px; background: #fff8e1; color: #4a4033; padding: 10px 14px 12px; border-radius: 3px; transform: rotate(-1.2deg);
              box-shadow: 0 3px 8px rgba(80,60,30,.25); font: 14px/1.35 "Segoe Print", "Comic Sans MS", cursive, sans-serif; pointer-events: none; }
      #todo h3 { margin: 0 0 4px; font-size: 16px; border-bottom: 2px dotted #d9c9a3; }
      #todo .q { margin-top: 6px; } #todo .qt { font-weight: 700; } #todo ul { list-style: none; margin: 2px 0 0; padding: 0; }
      #todo li.done { text-decoration: line-through; opacity: .6; } #todo .timer { font-weight: 400; color: #8a7b5c; } #todo .timer.low { color: #d6453d; font-weight: 700; }
      #todo .hint { font-size: 12px; color: #8a7b5c; margin: 1px 0 3px 18px; line-height: 1.25; } #todo .esc { font-size: 12px; color: #d6453d; } #todo .esc.good { color: #3f9a62; }
      #todo .teaser { font-size: 12px; color: #8a7b5c; margin: 0 0 2px 2px; line-height: 1.25; } #todo .locked, #todo .won { opacity: .6; } #todo li.later { opacity: .55; }
      #todo { max-height: 78vh; overflow: hidden; }
      @media (max-height: 820px) { #todo .teaser { display: none; } #todo { font-size: 13px; } }
      #todo .ok { color: #3f9a62; } #todo .bad { color: #d6453d; }
      #heat { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); width: 240px; background: rgba(255,255,255,.78); padding: 5px 10px 6px; border-radius: 8px; font: 12px/1.3 system-ui, sans-serif; color: #3a3a4a; pointer-events: none; text-align: center; }
      #heat .name { font-weight: 700; } #heat .mood { color: #6a6a7a; }
      #heat .hb { position: relative; height: 8px; background: rgba(0,0,0,.12); border-radius: 5px; margin: 3px 0; overflow: hidden; }
      #heat .hf { height: 100%; width: 0; background: #a9dcff; transition: width .15s; }
      #heat .hb i { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,.9); }
      #heat .hd { min-height: 14px; font-size: 11px; color: #6a5a4a; } #heat .hd .learned { opacity: .55; text-decoration: line-through; }
      #heat .hh { font-size: 11px; color: #8a8aa0; } #heat .hh.on { color: #e08a1e; font-weight: 700; }
      #announce { position: fixed; top: 92px; left: 50%; transform: translate(-50%, -30px); min-width: 340px; max-width: 560px; text-align: center; padding: 10px 22px 12px; border-radius: 12px; color: #fff; opacity: 0; pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.25); font-family: system-ui, sans-serif; }
      #announce.on { opacity: 1; transform: translate(-50%, 0); transition: opacity .25s, transform .25s; }
      #announce .at { font-size: 24px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
      #announce .as { font-size: 15px; margin-top: 3px; opacity: .95; }
      #announce.alert { background: #e5484d; } #announce.adapt { background: #e8833a; } #announce.learned { background: #3f9a62; }
      #heat .hn { font-size: 11px; color: #8a8aa0; }
      #levelcomplete { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(255,248,225,.55); font-family: system-ui, sans-serif; }
      #levelcomplete[hidden] { display: none; }
      #levelcomplete .lc-card { background: #fff8e1; color: #4a4033; padding: 22px 34px; border-radius: 14px; box-shadow: 0 10px 30px rgba(80,60,30,.3); min-width: 340px; text-align: center; }
      #levelcomplete h2 { margin: 0; font-size: 28px; } #levelcomplete .lc-sub { margin: 2px 0 10px; color: #8a7b5c; }
      #levelcomplete .lc-quests { list-style: none; padding: 0; margin: 0 0 10px; text-align: left; } #levelcomplete .lc-quests li.won { color: #3f9a62; }
      #levelcomplete table { width: 100%; border-collapse: collapse; margin-bottom: 10px; } #levelcomplete td { padding: 3px 4px; text-align: left; border-bottom: 1px dotted #d9c9a3; } #levelcomplete td:last-child { text-align: right; font-weight: 700; }
      #levelcomplete .lc-note { margin: 4px 0; color: #3f9a62; font-weight: 700; }
      #levelcomplete .lc-keys { margin: 4px 0 0; color: #8a7b5c; }
      #waypoints { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      #waypoints .wp { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 6px; background: rgba(255, 210, 63, .95); color: #4a3a10; padding: 3px 10px; border-radius: 12px; font: 700 13px system-ui, sans-serif; box-shadow: 0 2px 6px rgba(0,0,0,.25); white-space: nowrap; }
      #waypoints .wp[hidden] { display: none; }
      #waypoints .wp-arrow { font-size: 16px; line-height: 1; }
      #skills { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(255,248,225,.5); font-family: system-ui, sans-serif; }
      #skills[hidden] { display: none; }
      #skills h3 { margin: 10px 0 4px; font-size: 15px; } .sk-looks { display: flex; flex-wrap: wrap; gap: 6px; }
      .sk-looks button { font: 13px system-ui, sans-serif; display: flex; align-items: center; gap: 5px; padding: 4px 8px; border: 2px solid transparent; border-radius: 9px; background: #fff3c4; color: #4a4033; cursor: pointer; }
      .sk-looks button.on { border-color: #e39a7e; background: #ffe9a0; } .sk-looks button.locked { opacity: .55; cursor: default; font-size: 12px; }
      .sk-looks .sw { width: 16px; height: 16px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
      #skills .sk-card { background: #fff8e1; color: #4a4033; padding: 18px 28px; border-radius: 14px; box-shadow: 0 10px 30px rgba(80,60,30,.3); width: 440px; max-width: 92vw; }
      #skills h2 { margin: 0 0 8px; } #skills ul { list-style: none; padding: 0; margin: 0; } #skills li { margin-bottom: 6px; opacity: .6; } #skills li.have { opacity: 1; }
      #skills li div { font-size: 13px; color: #6a5a4a; margin-left: 20px; }
      #skills kbd { background: #fff; border: 1px solid #d9c9a3; border-radius: 4px; padding: 0 5px; font: 12px monospace; }
      #skills .sk-replay { margin: 10px 0 4px; font-size: 13px; } #skills .sk-keys { margin: 8px 0 0; color: #8a7b5c; font-size: 12px; }
      #abilities { position: fixed; right: 14px; bottom: 56px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; font: 600 12px system-ui, sans-serif; }
      #abilities .ab { background: rgba(255,255,255,.8); color: #4a4033; padding: 4px 10px; border-radius: 8px; min-width: 90px; }
      #abilities .ab[hidden] { display: none; } #abilities .ab b { background: #ffd23f; border-radius: 4px; padding: 0 5px; margin-right: 4px; }
      #abilities .abf { height: 4px; margin-top: 3px; background: #a9dcff; border-radius: 3px; } #abilities .ab.ready .abf { background: #6bd66b; } #abilities .ab.on { background: #d6e4ff; }
      #runhud { position: fixed; top: 50px; right: 14px; background: rgba(40,40,60,.8); color: #fff; padding: 4px 12px; border-radius: 8px; font: 700 14px monospace; pointer-events: none; }
      #runhud[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot"><div><h1>Lokki</h1><p>Loading Helsinki&hellip;</p><div class="bar"><i></i></div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
