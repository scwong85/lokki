      body.hud-minimal #todo .q:not(.active):not(.lost), body.hud-minimal #todo .q.side { display: none; }

      #minitimer { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); padding: 3px 12px; border-radius: 12px; background: rgba(255,255,255,.8); color: #3a3a4a; font: 700 15px system-ui, sans-serif; pointer-events: none; z-index: 20; }
